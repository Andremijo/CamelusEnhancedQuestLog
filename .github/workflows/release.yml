# Publishes a GitHub release with a ready-to-install zip.
# Two ways to start it:
#   * Actions tab -> Release -> "Run workflow": the version is read from
#     "## Version:" in QuestLogCompletedMarker.toc and the tag (v1.4.0) is created.
#   * Push a version tag, e.g. `git tag v1.4.0 && git push origin v1.4.0`.
#     The tag must match "## Version:" in QuestLogCompletedMarker.toc.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        run: |
          version=$(sed -n 's/^## Version: *//p' QuestLogCompletedMarker/QuestLogCompletedMarker.toc | tr -d '\r')
          if [ -z "$version" ]; then
            echo "No '## Version:' line in QuestLogCompletedMarker.toc"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the .toc version $version"
            exit 1
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"
          interface=$(sed -n 's/^## Interface: *//p' QuestLogCompletedMarker/QuestLogCompletedMarker.toc | tr -d '\r' | cut -d, -f1 | tr -d ' ')
          echo "INTERFACE=$interface" >> "$GITHUB_ENV"

      - name: Build the zip
        run: zip -r "QuestLogCompletedMarker-$TAG.zip" QuestLogCompletedMarker

      # release.json tells addon managers such as WoWUp which game client
      # the zip is for ("forever" = WoW Forever), in the same format as the
      # BigWigs packager.
      - name: Write release.json
        run: |
          cat > release.json <<JSON
          {
            "releases": [
              {
                "name": "Quest Log Completed Marker",
                "version": "$TAG",
                "filename": "QuestLogCompletedMarker-$TAG.zip",
                "nolib": false,
                "metadata": [
                  { "flavor": "forever", "interface": $INTERFACE }
                ]
              }
            ]
          }
          JSON
          python3 -m json.tool release.json

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          Download **QuestLogCompletedMarker-$TAG.zip** below and unzip it into your game's \`Interface\\AddOns\\\` folder, so that you get \`Interface\\AddOns\\QuestLogCompletedMarker\\QuestLogCompletedMarker.toc\`. Then restart the game or type \`/reload\`.

          Type \`/qlc\` in game to open the options. See the [README](https://github.com/$GITHUB_REPOSITORY#readme) for all features and commands.
          NOTES
          if [ -f CHANGELOG.md ]; then
            echo "" >> notes.md
            echo "## Changes" >> notes.md
            awk -v v="${TAG#v}" '
              $0 ~ "^## " v "( |$)" { on = 1; next }
              /^## / && on { exit }
              on { print }
            ' CHANGELOG.md >> notes.md
          fi
          gh release create "$TAG" "QuestLogCompletedMarker-$TAG.zip" release.json \
            --target "$GITHUB_SHA" \
            --title "Quest Log Completed Marker ${TAG#v}" \
            --notes-file notes.md
