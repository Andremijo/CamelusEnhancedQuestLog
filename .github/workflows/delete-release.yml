# Deletes one GitHub release (the zip and release notes). The git tag is kept.
# Start it by hand: Actions -> Delete release -> Run workflow, and enter the tag, e.g. v1.4.0.
name: Delete release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release to delete, e.g. v1.4.0"
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "\"$TAG\" is not a version tag like v1.4.0"
            exit 1
          fi
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          echo "Deleted the release $TAG (the tag itself is kept)"
